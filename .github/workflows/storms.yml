name: Update storms.json
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/update_storms.py', '.github/workflows/storms.yml']
permissions:
  contents: write
concurrency:
  group: storms
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch active tropical cyclones from GDACS
        run: python3 scripts/update_storms.py
      - name: Validate
        run: python3 -c "import json;d=json.load(open('storms.json'));assert 'updatedAt' in d and isinstance(d['storms'],list);print(len(d['storms']),'storms')"
      - name: Commit
        run: |
          git config user.name "storm-feed-bot"
          git config user.email "storm-feed-bot@users.noreply.github.com"
          git add storms.json
          git commit -m "Storm update $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin main
          git push
