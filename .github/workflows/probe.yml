name: probe-sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe storm data sources
        run: |
          mkdir -p probe
          curl -sS -m 60 -A "uamaritime-storm-feed" "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=TC" -o probe/gdacs_list.json || echo fail > probe/gdacs_list.err
          curl -sS -m 60 -A "uamaritime-storm-feed" "https://www.nhc.noaa.gov/CurrentStorms.json" -o probe/nhc.json || echo fail > probe/nhc.err
          python3 - <<'P'
          import json
          try:
              d=json.load(open('probe/gdacs_list.json'))
              f=d.get('features',[])
              print('gdacs features',len(f))
              for x in f[:3]:
                  p=x['properties'];print(p.get('eventid'),p.get('episodeid'),p.get('name'),p.get('fromdate'),p.get('todate'),p.get('iscurrent'))
          except Exception as e: print('gdacs err',e)
          P
          ls -la probe
      - name: Fetch one GDACS geometry for format check
        run: |
          python3 - <<'P'
          import json,urllib.request
          d=json.load(open('probe/gdacs_list.json'))
          f=[x for x in d.get('features',[]) if str(x['properties'].get('iscurrent')).lower()=='true'] or d.get('features',[])
          if f:
              p=f[0]['properties']
              u=f"https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=TC&eventid={p['eventid']}&episodeid={p['episodeid']}"
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'uamaritime-storm-feed'}),timeout=60).read()
              open('probe/gdacs_geom.json','wb').write(r)
          P
      - name: Commit probe output
        run: |
          git config user.name "storm-feed-bot"
          git config user.email "storm-feed-bot@users.noreply.github.com"
          git add probe
          git commit -m "Probe storm sources" || true
          git push
